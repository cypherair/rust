name: arm64e Stage1 Prerelease

# Builds the stage1 toolchain with arm64e std, from LLVM's own source, at the commit the run is
# dispatched on, and checks it. Only a run with `create_release` publishes a prerelease; any other
# run keeps the toolchain as a workflow artifact for seven days.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish a prerelease instead of keeping the toolchain as a workflow artifact.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# A second dispatch on the same ref waits for the first, so it never cuts off a publish.
concurrency:
  group: arm64e-stage1-prerelease-${{ github.ref }}
  cancel-in-progress: false

env:
  ASSET: rust-stage1-for-arm64e-aarch64-apple-darwin.tar.zst

jobs:
  build:
    if: github.repository == 'cypherair/rust'
    # GitHub's arm64 `macos-26` image is short of capacity; `xcode-27` gets runners. Its Xcode is
    # the one the app builds with.
    runs-on: xcode-27
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    outputs:
      rustc_version: ${{ steps.package.outputs.rustc_version }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOST_TRIPLE: aarch64-apple-darwin
      ARM64E_TARGETS: arm64e-apple-darwin arm64e-apple-ios arm64e-apple-visionos
      # LLVM and rustc run on macOS 11 and later, as upstream's do, whatever SDK the image has. std
      # for macOS has the same default.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Verify the LLVM IR of everything the stage1 compiler builds, std for every target included.
      # `rust.verify-llvm-ir` would be compiled into rustc itself.
      RUSTFLAGS_NOT_BOOTSTRAP: -Zverify-llvm-ir
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false

      # On the default `dev` channel, the compiler accepts unstable features in every crate, calls
      # itself `-dev`, which build scripts take for a nightly, and turns on the next trait solver
      # and Polonius by default. On `stable`, bootstrap would compile compiler-rt's C into std with
      # the image's clang; `optimized-compiler-builtins = false` keeps std pure Rust.
      - name: Configure the build
        run: |
          set -euo pipefail
          cat > bootstrap.toml <<'EOF'
          change-id = "ignore"

          [build]
          optimized-compiler-builtins = false

          [llvm]
          download-ci-llvm = false

          [rust]
          channel = "stable"
          EOF
          sw_vers
          xcodebuild -version

      # The validation workflow's test list, against the compiler and LLVM that this run ships.
      - name: Run the arm64e and pauthtest tests
        run: |
          set -euo pipefail
          python3 x.py test --stage 1 --force-rerun --no-fail-fast \
            tests/codegen-llvm/arm64e-apple-ptrauth*.rs \
            tests/assembly-llvm/arm64e-apple-ptrauth-calls.rs \
            tests/assembly-llvm/targets/targets-macho.rs \
            tests/ui/compile-flags/invalid/branch-protection-arm64e-apple-pac-ret.rs \
            tests/ui/compile-flags/invalid/target-feature-arm64e-apple-ptrauth-disable.rs \
            tests/run-make/arm64e-ptrauth-allocator-shim \
            tests/run-make/arm64e-ptrauth-serialized-output \
            tests/codegen-llvm/pauth \
            tests/assembly-llvm/pauth-basic.rs \
            tests/assembly-llvm/targets/targets-elf.rs \
            tests/ui/pointer_authentication \
            tests/ui/statics/crt-static-pauthtest.rs \
            tests/ui/target_modifiers/incompatible_pauth.rs

      # `library/test` lets `cargo test` build for the arm64e targets.
      - name: Build the compiler and std
        run: |
          set -euo pipefail
          python3 x.py build --stage 1 compiler/rustc library/std library/proc_macro library/test \
            --target "$HOST_TRIPLE,${ARM64E_TARGETS// /,}"

      - name: Check the arm64e std objects
        run: |
          set -euo pipefail
          for target in $ARM64E_TARGETS; do
            echo "=== $target"
            python3 -I .github/arm64e/check_objects.py "build/$HOST_TRIPLE/llvm/bin" \
              "build/$HOST_TRIPLE/stage1/lib/rustlib/$target/lib/"*.rlib
          done

      # A Rust static library in a clang-built host, at -O and -O0, and the object check on the
      # linked hosts.
      - name: Run the app-shape case and check the linked binaries
        timeout-minutes: 15
        run: |
          set -euo pipefail
          for opt in 2 0; do
            .github/arm64e/app-shape/run.sh "build/$HOST_TRIPLE/stage1/bin/rustc" "$opt" \
              "$RUNNER_TEMP/app-shape-O$opt"
          done
          python3 -I .github/arm64e/check_objects.py "build/$HOST_TRIPLE/llvm/bin" --linked \
            "$RUNNER_TEMP/app-shape-O2/host" "$RUNNER_TEMP/app-shape-O0/host"

      - name: Package the toolchain
        id: package
        run: |
          set -euo pipefail
          if [ -e "build/$HOST_TRIPLE/ci-llvm" ]; then
            echo "::error::build/$HOST_TRIPLE/ci-llvm exists: bootstrap used upstream's prebuilt LLVM."
            exit 1
          fi

          dist="dist/stage1-arm64e-patch"
          rsync -a --delete "build/$HOST_TRIPLE/stage1/" "$dist/"
          find "$dist" -name '*.dSYM' -prune -exec rm -rf {} +
          src="$dist/lib/rustlib/src/rust"
          rm -rf "$src"
          mkdir -p "$src/src/llvm-project"
          rsync -a library "$src/"
          rsync -a src/llvm-project/libunwind "$src/src/llvm-project/"

          # Everything below runs the packaged compiler, not the one in `build/`.
          rustc="$PWD/$dist/bin/rustc"
          "$rustc" -vV
          if ! "$rustc" -vV | grep -Eqx 'release: [0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::The compiler is not on the stable channel."
            exit 1
          fi
          # `--print target-libdir` also fails for a target the compiler does not know.
          for target in "$HOST_TRIPLE" $ARM64E_TARGETS; do
            libdir="$("$rustc" --print target-libdir --target "$target")"
            ls "$libdir"/libstd-*.rlib "$libdir"/libtest-*.rlib
          done
          ls "$("$rustc" --print target-libdir --target "$HOST_TRIPLE")"/libproc_macro-*.rlib
          test -d "$("$rustc" --print sysroot)/lib/rustlib/src/rust/library"

          work="$RUNNER_TEMP/packaged"
          mkdir -p "$work"
          printf 'fn main() {\n    println!("hello");\n}\n' > "$work/hello.rs"
          for target in "$HOST_TRIPLE" arm64e-apple-darwin; do
            "$rustc" -O --target "$target" "$work/hello.rs" -o "$work/hello-$target"
            test "$("$work/hello-$target")" = hello
          done
          printf '#[test]\nfn adds() {\n    assert_eq!(std::hint::black_box(2) + 2, 4);\n}\n' \
            > "$work/harness.rs"
          "$rustc" -O --test --target arm64e-apple-darwin "$work/harness.rs" -o "$work/harness"
          "$work/harness" | tee "$work/harness.txt"
          grep -q '^test result: ok\. 1 passed' "$work/harness.txt"

          bsdtar -cf - -C dist stage1-arm64e-patch | zstd -T0 -19 -o "$ASSET"
          ls -l "$ASSET"
          echo "rustc_version=$("$rustc" -V)" >> "$GITHUB_OUTPUT"

      - name: Upload the toolchain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64e-stage1-toolchain
          path: ${{ env.ASSET }}
          retention-days: 7
          if-no-files-found: error

  publish:
    if: github.repository == 'cypherair/rust' && inputs.create_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the toolchain
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arm64e-stage1-toolchain

      # Ties the toolchain to this workflow, this run and the commit it built.
      - name: Attest the toolchain
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Publish the prerelease
        env:
          RUSTC_VERSION: ${{ needs.build.outputs.rustc_version }}
        run: |
          set -euo pipefail
          tag="rust-stage1-arm64e-toolchain-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          cat > notes.md <<EOF
          ${RUSTC_VERSION}, with std for the Apple arm64e targets, for CypherAir.

          - Commit: \`${GITHUB_SHA}\`
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          To check that this workflow built the toolchain from that commit:

          \`\`\`bash
          gh attestation verify ${ASSET} -R ${GITHUB_REPOSITORY} --source-ref ${GITHUB_REF} --source-digest ${GITHUB_SHA}
          \`\`\`
          EOF
          gh release create "$tag" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "Rust arm64e stage1 toolchain ($tag)" \
            --notes-file notes.md \
            --prerelease \
            --latest=false

      - name: Remove a half-made release
        if: failure() || cancelled()
        run: |
          if [ -n "${TAG:-}" ]; then
            gh release delete "$TAG" --cleanup-tag --yes || true
          fi
